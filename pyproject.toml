[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisionmesh"
version = "0.1.0"
description = "Temporal Decision Intelligence Engine — treats decisions as living, temporal objects"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"
authors = [
    { name = "DecisionMesh Contributors" }
]
keywords = ["decision-making", "ai", "agents", "temporal-reasoning", "causal-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Anthropic SDK
    "anthropic>=0.40.0",
    # LangGraph for agent state machines
    "langgraph>=0.2.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Web search (optional)
    "tavily-python>=0.3.0",
    # Local embeddings
    "sentence-transformers>=2.7.0",
    # API layer
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
dm = "decisionmesh.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["decisionmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=decisionmesh --cov-report=term-missing"

[tool.coverage.run]
source = ["decisionmesh"]
omit = ["tests/*", "alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
