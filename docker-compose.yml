version: "3.9"

services:
  # ── DecisionMesh API (SQLite, default) ──────────────────────────────────────
  decisionmesh:
    build: .
    container_name: decisionmesh
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - decisionmesh_data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:////data/decisionmesh.db
      - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-3-7-sonnet-20250219}
      - DIVERGENCE_ALERT_THRESHOLD=${DIVERGENCE_ALERT_THRESHOLD:-0.3}
      - DIVERGENCE_CRITICAL_THRESHOLD=${DIVERGENCE_CRITICAL_THRESHOLD:-0.7}
      - DEFAULT_REVIEW_INTERVAL_DAYS=${DEFAULT_REVIEW_INTERVAL_DAYS:-30}
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-UTC}
      - DISABLE_ALL_WEB_MONITORING=${DISABLE_ALL_WEB_MONITORING:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL (optional, for production) ───────────────────────────────────
  # Uncomment to use PostgreSQL + pgvector instead of SQLite
  #
  # postgres:
  #   image: ankane/pgvector:latest
  #   container_name: decisionmesh_postgres
