  #     POSTGRES_DB: decisionmesh
  #     POSTGRES_USER: decisionmesh
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U decisionmesh"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # decisionmesh_pg:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://decisionmesh:${POSTGRES_PASSWORD:-changeme}@postgres:5432/decisionmesh
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

volumes:
  decisionmesh_data:
    driver: local
